<style>
/* Layout: one-column phone app. Interviewers sit at the very top of the screen, right under the front camera,
   so looking at their eyes reads as eye contact. Kitchen subway-tile stage, saffron "ticket" accents. */
:root{
  --ink:#0f1720; --panel:#17222d; --panel2:#1e2b38; --line:#2c3b4a;
  --text:#eef2f5; --muted:#9db0c0; --saffron:#f4b740; --saffron-ink:#2a1d00;
  --mint:#4fd1a5; --sky:#7cc4ff; --soft:#c9a7ff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 22px;font:700 1rem var(--body);background:var(--saffron);color:var(--saffron-ink);cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.mint{background:var(--mint);color:#06281d}
.btn.wide{width:100%}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.btn[disabled]{opacity:.45}
input[type=text],textarea,select{width:100%;background:var(--panel2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:1rem var(--body)}
textarea{min-height:110px;resize:vertical}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:9px 14px;font:600 .92rem var(--body);cursor:pointer}
.chip.on{background:var(--saffron);color:var(--saffron-ink);border-color:var(--saffron)}
.opt{appearance:none;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--r);padding:14px;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
.opt.on{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron) inset}
.opt b{font-family:var(--display);font-size:1.08rem}
.ticket{background:repeating-linear-gradient(90deg,transparent 0 8px,var(--line) 8px 10px) top/100% 2px no-repeat, var(--panel);border-radius:4px 4px var(--r) var(--r);padding:16px;border:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.06em;font-size:.85rem;color:var(--saffron)}
/* lesson path */
.path{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--text);text-align:left;font:inherit;width:100%;cursor:pointer}
.step[disabled]{opacity:.5;cursor:default}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--panel2);border:1.5px solid var(--line)}
.step.done .num{background:var(--mint);color:#06281d;border-color:var(--mint)}
.step.next{border-color:var(--saffron)}
.step.next .num{background:var(--saffron);color:var(--saffron-ink);border-color:var(--saffron)}
.step.measure .num{border-style:dashed}
.pill{font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.good{background:rgba(79,209,165,.15);color:var(--mint)}
.pill.warm{background:rgba(244,183,64,.15);color:var(--saffron)}
/* stage */
.stage{position:relative;border-radius:0 0 22px 22px;margin:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px 10px 12px;
  background:
   linear-gradient(180deg,rgba(15,23,32,.0),rgba(15,23,32,.55)),
   repeating-linear-gradient(0deg,#d9dfe3 0 22px,#b9c2c8 22px 24px),
   #d9dfe3;}
.stage .tiles{position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(120,132,140,.55) 46px 48px);pointer-events:none}
.faces{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.faces.n1{justify-content:center}
.face{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .3s, filter .3s}
.faces.n1 .face{width:64%}.faces.n2 .face{width:44%}.faces.n3 .face{width:32%}
.face svg{width:100%;height:auto;display:block;border-radius:50% 50% 12px 12px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.avbox{position:relative;width:100%;aspect-ratio:200/220}
.avbox>div{position:absolute;inset:0}
.avbox .th{border-radius:50% 50% 12px 12px;overflow:hidden}
.avbox .th canvas{display:block}
.face .tag{margin-top:-6px;background:var(--ink);color:var(--text);font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.face.dim{filter:saturate(.55) brightness(.85);transform:scale(.94)}
.face.speaking .tag{background:var(--saffron);color:var(--saffron-ink)}
.face .ring{position:absolute;inset:-4px -4px 18px -4px;border-radius:50% 50% 16px 16px;border:4px solid transparent;transition:border-color .2s}
.face.contact .ring{border-color:var(--mint)}
.face.target .ring{border-color:var(--sky);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.lid{transform-box:fill-box;transform-origin:center top;transform:scaleY(0);transition:transform .08s}
.blink .lid{transform:scaleY(1)}
.nod{animation:nod 2.8s ease-in-out infinite}
@keyframes nod{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(3px)}90%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.nod,.face.target .ring{animation:none}}
.caption{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.25;text-wrap:balance;min-height:3.2em}
.live-tx{color:var(--muted);font-size:.95rem;min-height:2.6em;max-height:7.5em;overflow:auto}
.mic{width:100%;min-height:76px;border-radius:22px;font-size:1.15rem}
.mic.rec{background:var(--mint);color:#06281d;animation:pulse 1.6s infinite}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--saffron)}.dots i.done{background:var(--mint)}
#cam{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:92px;height:122px;object-fit:cover;border-radius:14px;transform:scaleX(-1);border:2px solid var(--line);z-index:5;background:#000}
#cam.hide{width:2px;height:2px;opacity:.01;border:0;pointer-events:none}
.eyedot{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.eyedot i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.eyedot.on i{background:var(--mint)}
/* results */
.score{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center}
.ringsvg{width:118px;height:118px}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:99px}
.bar.s>i{background:var(--saffron)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(even){text-align:right;font-weight:700}
details{background:var(--panel2);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:700}
.tag2{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(124,196,255,.14);color:var(--sky);margin:2px 4px 0 0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .chip{padding:10px 0;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(8,12,17,.82);display:grid;place-items:center;z-index:20;padding:20px}
.overlay .card{max-width:420px;width:100%}
.spark{width:100%;height:70px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--mint);color:#06281d;font-weight:700;padding:10px 18px;border-radius:999px;z-index:30}
</style>
</head>

function followUp(item, m, used, l) {
  if (item.bank || l.kind === "measure" || item.isFU || ["rapid","greet","close"].includes(item.t)) return null;
  const mode = challengeMode(); if (used >= mode.fu) return null;

}
H.questionReview = d => { allowQuestionReview = true; openPrep(d.id, pendingReview, true); };
async function calibrate(l) {
  const generation = mediaGeneration;
  const lay = layoutFor(l), ids = l.single ? [l.cast[0]] : l.cast;
  const targets = {}, spreads = [];
  status("Quick eye setup (a few seconds).");
  for (let i = 0; i < lay.length; i++) {
    const id = ids[i] || ids[0], f = $("#f-" + id);
    document.querySelectorAll(".face").forEach(x => x.classList.remove("target")); f && f.classList.add("target");
    caption(`Look into ${CH[id].short}'s eyes and hold still…`);
    await sleep(900);
    if (generation !== mediaGeneration) return false;
    let pts = await collect(1300);
    if (generation !== mediaGeneration) return false;
    if (pts.length < 5) { caption("I can't see your face yet. Hold the phone at eye level with light on your face."); await sleep(2500); pts = await collect(1500); }
    if (pts.length < 5) { document.querySelectorAll(".face").forEach(x => x.classList.remove("target")); return false; }
    targets[lay[i]] = { x: mean(pts.map(p => p.x)), y: mean(pts.map(p => p.y)) };
    spreads.push(sd(pts.map(p => p.x)), sd(pts.map(p => p.y)));
  }
  document.querySelectorAll(".face").forEach(x => x.classList.remove("target"));
  const ks = Object.values(targets);
  let sep = 99; for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) sep = Math.min(sep, Math.hypot(ks[i].x - ks[j].x, ks[i].y - ks[j].y));
  const spread = mean(spreads);
  const tolX = ks.length > 1 ? clamp(sep * 0.6, 4, 12) : Math.max(7, spread * 3);
  V.calib = { targets, tolX, tolY: Math.max(8, spread * 3), quality: { spread: +spread.toFixed(2), sep: ks.length > 1 ? +sep.toFixed(1) : null } };
  return true;
}
function getAnswer(item, recordIt) {
  return new Promise(resolve => {

    let timer;
    cancelAnswer = () => { if (finished) return; finished = true; clearTimeout(timer); if (L) L.cancel(); recRelease(); resolve(null); };
    const finish = async () => {
      if (finished) return; finished = true; clearTimeout(timer); cancelAnswer = null;
      const generation = mediaGeneration;
      let text = typed ? ($("#ans") || {}).value || "" : L ? await L.stop() : "";
      if (generation !== mediaGeneration) { resolve(null); return; }
      const blob = recordIt ? await recStop() : null;
      if (generation !== mediaGeneration) { resolve(null); return; }
      recRelease();
      resolve({ text, timing: { start: t0, first: typed ? firstKey : (L && L.firstAt), end: Date.now() }, typed, repeats, blob });

  const fields = ["feedbackSkipped", "feel", "challengeDecision", "attempt", "confidence", "nerves", "comfort", "useful", "diff", "hard", "comment", "secs", "flags", "valid", "adaptations", "score"];
  const entries = state.records.filter(r => r.kind === "survey" || r.kind === "intake").map(r => {
    const b = r.body || {}, item = { kind: r.kind === "intake" ? "check-in" : "survey", lesson: b.lessonId ?? "unknown", timestamp: b.at ?? "unknown", appVersion: b.app ?? "unknown" };
    for (const k of (r.kind === "intake" ? ["confidence", "nerves"] : fields)) if (Object.prototype.hasOwnProperty.call(b, k)) item[k] = b[k];
    if (b.comment === "[filtered]") item.contentNote = "Original comment unavailable: historically filtered.";
    return item;
  });
  if (state.intake && !state.records.some(r => r.kind === "intake")) {
    const b = state.intake;
    entries.unshift({ kind: "check-in", lesson: "unknown", timestamp: b.at ?? "unknown", appVersion: "unknown", ...Object.fromEntries(["confidence", "nerves"].filter(k => Object.prototype.hasOwnProperty.call(b, k)).map(k => [k, b[k]])) });
  }
  return { app: "Paydirt", exportVersion: VERSION, persistence: pending ? "Includes in-memory changes that have not been saved. Keep this page open." : "From current browser state", limitations: "Historical filtered comments and failed writes from closed sessions cannot be recovered. Unknown metadata is marked unknown.", entries };
}
H.feedback = () => {
  const text = JSON.stringify(feedbackPayload(), null, 2);
  const d = modal(`<h3>Copy my feedback for the team</h3><p>Review your saved feedback and any pending changes below. Nothing is sent automatically.</p><label for="feedback-preview">Feedback preview</label><textarea id="feedback-preview" readonly style="min-height:240px"></textarea><p id="feedback-status" role="status"></p><button class="btn" id="feedback-copy">Copy feedback</button><button class="btn ghost" id="feedback-close">Close</button>`);
  const area = d.querySelector("#feedback-preview"), status = d.querySelector("#feedback-status");
  area.value = text; // Assign as text, never interpolate user comments into HTML.
  d.querySelector("#feedback-copy").onclick = async () => {
    try { await navigator.clipboard.writeText(text); status.textContent = "Copied: paste it into your Claude chat."; }
    catch (e) { status.textContent = "Copy did not complete. Select and copy the preview manually. On your phone, press and hold the text and choose Copy if available. Nothing has been sent."; area.focus(); area.select(); }
  };
  d.querySelector("#feedback-close").onclick = () => d.remove();
  // This handler is entered by the explicit Copy action; preserve its user activation.
  d.querySelector("#feedback-copy").onclick();
};
H.export = async () => {
  const data = { app: "Paydirt", version: VERSION, exportedAt: new Date().toISOString(), profile: { name: S.profile.name, job: S.profile.job, created: S.profile.created },
    settings: S.settings, intake: S.intake, jobs: S.jobs, consent: S.consent, progress: S.progress, chainValid: await verifyChain(), head: S.lastHash, records: S.records };
  const text = JSON.stringify(data);
  try { if (navigator.share) { await navigator.share({ title: "Paydirt results", text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it in a text to Dad."); }
  catch (e) { const d = modal(`<h3>Copy your results</h3><textarea readonly style="min-height:200px">${esc(text)}</textarea><button class="btn" id="cx">Close</button>`); d.querySelector("textarea").select(); d.querySelector("#cx").onclick = () => d.remove(); }
};

/* --- Settings --- */
H.settings = () => {
  const s = S.settings, tog = (k, label, sub) => `<label class="spread card" style="padding:12px"><span><b>${label}</b><br><span class="small muted">${sub}</span></span><input type="checkbox" data-set="${k}" ${s[k] ? "checked" : ""}></label>`;
  render(`
  <div class="stack" style="padding-top:8px">
    <div class="spread"><button class="chip" data-a="home">&larr; Back</button><span class="label">Settings</span></div>
    <h2>Training speed</h2>
    <div class="stack">${Object.entries(MODES).map(([k, m]) => `<button class="opt ${s.mode === k ? "on" : ""}" data-a="mode" data-k="${k}"><b>${m.label}</b><span class="muted small">${m.desc}</span></button>`).join("")}</div>
    <h2>Practice options</h2>
    ${tog("camera", "Eye-contact coaching", "Uses the front camera on this phone only. Camera video is not recorded; optional answer audio recording is a separate setting.")}
    ${tog("eyeLight", "Eye-contact light", "A green ring glows while you're looking at the right person.")}
    ${tog("selfView", "Show my camera", "Some people find seeing themselves distracting. Off by default.")}
    ${tog("captions", "Show questions as text", "Helps if a voice is hard to hear.")}
    ${tog("transcripts", "Save what I said", "Lets you and your coach review your answers. Saved in this browser; included when you choose Share results.")}
    <p class="small muted">Automatic result/audio uploads are disabled. External fonts, scripts and models use network services. Browser speech recognition may send audio to its provider. Use typing to avoid voice recognition.</p>
    <label class="spread card" style="padding:12px"><span><b>Record measured-interview answers</b><br><span class="small muted">Audio only, for before/after ratings. Off unless you turn it on.</span></span><input type="checkbox" id="cs-rec" ${S.consent.record ? "checked" : ""}></label>
    <button class="btn ghost wide" data-a="intake">Edit my stories and goals</button>
    <label class="spread card" style="padding:12px"><span><b>Answer by typing</b><br><span class="small muted">Use if voice doesn't work on this device.</span></span><input type="checkbox" id="typeMode" ${s.input === "type" ? "checked" : ""}></label>
    <div class="card stack"><label class="label" for="nm2">Name</label><input id="nm2" type="text" value="${esc(S.profile.name)}"></div>
    <button class="btn ghost wide" data-a="reset">Erase all data on this phone</button>
    <p class="small muted">Paydirt ${VERSION}</p>
  </div>`);
  document.querySelectorAll("[data-set]").forEach(i => i.onchange = () => { S.settings[i.dataset.set] = i.checked; save(); });
  $("#cs-rec").onchange = e => { S.consent.record = e.target.checked; save(); appendRecord("consent", { ...S.consent, at: new Date().toISOString() }); };
  $("#typeMode").onchange = e => { S.settings.input = e.target.checked ? "type" : "voice"; save(); };
  $("#nm2").onchange = e => { S.profile.name = e.target.value.trim().slice(0, 30) || S.profile.name; save(); };
};
H.reset = () => {
  const d = modal(`<h3>Erase everything?</h3><p class="muted">This deletes all scores and progress on this phone. Share your results first if you want to keep them.</p><div class="row"><button class="btn" id="r1">Erase</button><button class="btn ghost" id="r2">Cancel</button></div>`);
  d.querySelector("#r2").onclick = () => d.remove();
  d.querySelector("#r1").onclick = () => { stopSession(); S = defaultState(); LAST = null; SV = null; RUN = null; REC.chunks = []; save(); d.remove(); viewWelcome(0); };
};

/* ============ BOOT ============ */
if (!window.isSecureContext) document.body.insertAdjacentHTML("afterbegin", `<p style="background:#f4b740;color:#2a1d00;padding:10px;margin:0;text-align:center">Open this page from an https:// link for camera and voice to work.</p>`);
S.profile.setupDone ? viewHome() : viewWelcome(0);
flushOutbox();
</script>
</body>
