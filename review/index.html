<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>PAYDIRT voice review</title><style>body{font:18px system-ui;background:#111827;color:#f8fafc;max-width:760px;margin:auto;padding:20px}a{color:#93c5fd}article{padding:20px 0;border-bottom:1px solid #64748b}button{font:inherit;padding:12px;margin:4px;border-radius:8px}button[aria-pressed=true]{background:#bae6fd}audio,textarea{width:100%}textarea{min-height:220px}#status{min-height:2em}</style><a href="../">Back to PAYDIRT</a><h1>Review the 21 voice clips</h1><p>Listen, then choose Good or Redo for each clip. Choices stay on this device. Copy results when ready; nothing is sent automatically.</p><p>Ellen has no recordings in this new question bank. These clips include pacing flags for human review.</p><div id="clips"></div><button id="copy">Copy results</button><button id="retry" hidden>Retry saving choices</button><p id="status" role="status"></p><label for="preview">Results preview / manual copy</label><textarea id="preview" readonly></textarea><script type="module">
const key='pd_voice_review_180_v1',build='v4.1-publication-295';let choices={},items=[],loadFailed=false;
const status=document.querySelector('#status'),preview=document.querySelector('#preview'),retry=document.querySelector('#retry');
try{const raw=JSON.parse(localStorage.getItem(key)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))choices=raw}catch(e){loadFailed=true;status.textContent='Saved choices could not be read. New choices remain in memory; copy results before leaving.'}
function payload(){return JSON.stringify({build,entries:items.map(x=>({id:x.id,character:x.character,choice:['Good','Redo'].includes(choices[x.id]?.choice)?choices[x.id].choice:null,at:choices[x.id]?.at||null}))},null,2)}
function refresh(){preview.value=payload()}
function save(){if(loadFailed){retry.hidden=false;status.textContent='Existing saved choices could not be read. Choices remain in memory; copy results before leaving.';return false}try{localStorage.setItem(key,JSON.stringify(choices));retry.hidden=true;status.textContent='Choices saved on this device.';return true}catch(e){retry.hidden=false;status.textContent='Choices were not saved. Keep this page open, retry saving, or copy results.';return false}}
retry.onclick=save;
document.querySelector('#copy').onclick=()=>{const text=payload();preview.value=text;let operation;try{operation=navigator.clipboard.writeText(text)}catch(e){failed();return}Promise.resolve(operation).then(()=>{status.textContent='Copied: paste it into your Claude chat.'},failed);function failed(){status.textContent='Copy did not complete. Select the results below and copy them manually.';preview.focus();preview.select()}};
try{const response=await fetch('./index.json');if(!response.ok)throw Error('Review list unavailable');items=await response.json();if(items.length!==21||new Set(items.map(x=>x.id)).size!==21)throw Error('Review list incomplete');for(const x of items){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=x.character+' — '+x.id;const text=document.createElement('p');text.textContent=x.transcript;const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src='./'+encodeURIComponent(x.id)+'.mp3';audio.onerror=()=>{status.textContent='A clip could not load: '+x.id+'. Review is incomplete.'};article.append(title,text,audio);for(const choice of ['Good','Redo']){const b=document.createElement('button');b.textContent=choice;b.dataset.id=x.id;b.setAttribute('aria-pressed',String(choices[x.id]?.choice===choice));b.onclick=()=>{choices[x.id]={choice,at:new Date().toISOString()};for(const other of article.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===b));refresh();save()};article.append(b)}document.querySelector('#clips').append(article)}refresh()}catch(e){status.textContent='Voice review could not load. No review completion is claimed.'}
</script></html>
